# Builds the static mirror (docs/) and publishes it to GitHub Pages on every push to main.
name: pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"        # refresh the home-page count (api/stats.json) every six hours
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install fastapi uvicorn python-multipart pymupdf httpx
      - run: python build_static.py --base /scientific-slop-demo --live https://scientific-slop-demo.onrender.com
        env:
          SCISLOP_SHEET_ID: ${{ secrets.SCISLOP_SHEET_ID }}   # repo secret; the submissions sheet the count is read from
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
