# Science Slop Index on Render (Blueprint). One public Docker web service.
# Render Dashboard -> New -> Blueprint -> this repo. No LLM key is stored on the server: visitors bring their own OpenRouter key.
services:
  - type: web
    name: scientific-slop-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/config
    autoDeploy: true
    envVars:
      # No OPENROUTER_API_KEY here: each visitor enters their own key on the site.
      - key: SCISLOP_MODEL
        value: openai/gpt-5.6-luna
      - key: SCISLOP_RATE_PER_HOUR
        value: "20"
      - key: SCISLOP_MAX_CONCURRENT
        value: "2"
      - key: SCISLOP_MAX_UPLOAD_MB
        value: "50"
