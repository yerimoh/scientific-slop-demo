# Science Slop Index on Render (Blueprint). One public Docker web service.
# Render Dashboard -> New -> Blueprint -> this repo. No LLM key is stored on the server: visitors bring their own OpenRouter key.
services:
  - type: web
    name: scientific-slop-demo
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard               # 2 GB RAM: the free 512 MB instance was OOM-killed under real traffic (2026-10-05)
    region: oregon
    healthCheckPath: /api/config
    autoDeploy: true
    disk:                        # visitor reports and listings survive restarts and deploys
      name: data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      - key: SCISLOP_PERSISTENT   # tells the UI that reports are kept
        value: "1"
      # SCISLOP_SHEET_ID (the submissions sheet, read for the home-page count) is set in the dashboard, not here.
      # No OPENROUTER_API_KEY here: each visitor enters their own key on the site.
      - key: SCISLOP_MODEL
        value: openai/gpt-5.6-luna
      - key: SCISLOP_RATE_PER_HOUR
        value: "20"
      - key: SCISLOP_MAX_CONCURRENT
        value: "2"
      - key: SCISLOP_MAX_UPLOAD_MB
        value: "50"
